name: Integrar diseño premium

on:
  push:
    branches: [main]
    paths:
      - 'premium_patch.py'
      - 'premium.css'
      - 'bodymap.js'
      - '.github/workflows/premium-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar parche
        run: python premium_patch.py
      - name: Guardar cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "Index ya actualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrar diseño premium y mapa muscular"
          git pull --rebase origin main
          git push
