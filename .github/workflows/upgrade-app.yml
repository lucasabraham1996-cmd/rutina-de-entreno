name: Actualizar diseño y rutina

on:
  push:
    branches: [main]
    paths:
      - 'upgrade_app.py'
      - '.github/workflows/upgrade-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar actualización
        run: python upgrade_app.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "No hay cambios para guardar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Modernizar app y actualizar plan de entrenamiento"
          git push
